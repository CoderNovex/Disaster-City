<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Survival City</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
<div class="title">SURVIVAL CITY</div>
<div>WASD: Drive • A/D: Steer • C: Change Car • Mouse: Look • Click: Lock</div>
<div>Press M: Full City Map</div>
<div>Survive: <span id="timer">120</span>s</div>
<div>❤️ Health: <span id="health">100</span>%</div>
<div>🍎 Hunger: <span id="hunger">100</span>%</div>
<div>💧 Thirst: <span id="thirst">100</span>%</div>
<div>⭐ Score: <span id="score">0</span></div>
<div id="status">Loading survival city...</div>
</div>
<canvas id="game"></canvas><canvas id="minimap" width="180" height="180"></canvas>
<script>
window.addEventListener("error",e=>{
  const s=document.getElementById("status");
  if(s)s.textContent="⚠️ JS error: "+(e.message||"module failed to load");
});
window.addEventListener("unhandledrejection",e=>{
  const s=document.getElementById("status");
  if(s)s.textContent="⚠️ Module error: "+(e.reason?.message||String(e.reason));
});
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js"}}</script>
<script type="module" src="game.js"></script>
</body></html>
